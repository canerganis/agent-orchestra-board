<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>Agent Orchestra Board</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Cpath d='M10 5.1A5.5 5.5 0 0 1 10 14.9A5.5 5.5 0 0 1 10 5.1Z' fill='%23c0461b'/%3E%3Ccircle cx='7.5' cy='10' r='5.5' fill='none' stroke='%2357534d' stroke-width='1.5'/%3E%3Ccircle cx='12.5' cy='10' r='5.5' fill='none' stroke='%2357534d' stroke-width='1.5'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="app no-ins" id="app">
  <header class="top">
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="Sessions and agents" aria-expanded="false" aria-controls="sidebar"><svg class="i" width="16" height="16" aria-hidden="true"><use href="#i-menu"/></svg></button>
    <button class="brand" id="homeBtn" aria-label="Agent Orchestra Board home">
      <!-- mark: two voices, the overlap is the agreement -->
      <svg class="logo" width="20" height="20" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
        <path class="lens" d="M10 5.1A5.5 5.5 0 0 1 10 14.9A5.5 5.5 0 0 1 10 5.1Z"/>
        <circle cx="7.5" cy="10" r="5.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <circle cx="12.5" cy="10" r="5.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
      </svg>
      <span class="txt">Agent Orchestra Board</span>
    </button>
    <span class="slash" aria-hidden="true">/</span>
    <div class="project" id="project"></div>
    <div class="top-right">
      <div class="meters" id="meters"></div>
      <span class="vsep" aria-hidden="true"></span>
      <div class="conn" id="conn" role="status" aria-live="polite"><span class="dot" aria-hidden="true"></span><span class="txt">Connecting</span></div>
      <div class="top-icons">
        <button class="icon-btn" id="helpBtn" title="Help and keyboard shortcuts (?)" aria-label="Help and keyboard shortcuts"><svg class="i" width="16" height="16" aria-hidden="true"><use href="#i-help"/></svg></button>
        <button class="icon-btn theme-btn" id="themeBtn" title="Switch light or dark theme" aria-label="Switch light or dark theme"><svg class="i" width="16" height="16" aria-hidden="true"><use href="#i-theme"/></svg></button>
        <button class="icon-btn ins-btn" id="insBtn" title="Workflow and usage" aria-label="Workflow and usage panel" aria-expanded="false" aria-controls="inspector"><svg class="i" width="16" height="16" aria-hidden="true"><use href="#i-panel"/></svg></button>
        <button class="icon-btn" id="settingsBtn" title="Settings" aria-label="Settings"><svg class="i" width="16" height="16" aria-hidden="true"><use href="#i-gear"/></svg></button>
      </div>
    </div>
  </header>

  <nav class="side" id="sidebar" aria-label="Sessions and agents">
    <div class="side-top">
      <button class="btn btn-new" id="newBtn"><svg class="i" width="14" height="14" aria-hidden="true"><use href="#i-plus"/></svg>New session<kbd aria-hidden="true">N</kbd></button>
      <label class="search"><svg class="i" width="14" height="14" aria-hidden="true"><use href="#i-search"/></svg><input id="search" type="search" placeholder="Search sessions…" aria-label="Search sessions" autocomplete="off" spellcheck="false"><kbd id="searchKbd" aria-hidden="true">Ctrl K</kbd></label>
    </div>
    <div class="side-scroll">
      <div id="sessions"></div>
      <section class="group" aria-labelledby="agentsH">
        <h2 class="group-label eyebrow" id="agentsH"><span>Agents</span><span class="count" id="agentsCount"></span><button class="icon-btn tiny" id="addAgent" title="Add agent" aria-label="Add agent"><svg class="i" width="12" height="12" aria-hidden="true"><use href="#i-plus"/></svg></button></h2>
        <div id="agents" role="list" aria-labelledby="agentsH"></div>
      </section>
    </div>
  </nav>

  <div class="side-scrim" id="sideScrim" aria-hidden="true"></div>
  <main class="main" id="main" tabindex="-1"></main>

  <aside class="right" id="inspector" aria-label="Workflow and usage"></aside>
</div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<div class="sr-only" id="live" aria-live="polite" aria-atomic="true"></div>
<div id="overlay"></div>

<!-- icon sprite: few, small, 1.5px strokes on a 16px grid. t-* are the tool marks (asterisk = Claude Code, prompt = Codex). -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="t-claude" viewBox="0 0 16 16"><path d="M8 2.5v11M2.5 8h11M4.1 4.1l7.8 7.8M11.9 4.1l-7.8 7.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="t-codex" viewBox="0 0 16 16"><path d="M3.5 4.5L7 8l-3.5 3.5M8.5 12h4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-user" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="5.5" r="2.5"/><path d="M3 13.5c.6-2.4 2.6-3.5 5-3.5s4.4 1.1 5 3.5"/></g></symbol>
  <symbol id="i-plus" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
  <symbol id="i-menu" viewBox="0 0 16 16"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
  <symbol id="i-search" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5l3 3"/></g></symbol>
  <symbol id="i-debate" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M2 3h7a1 1 0 0 1 1 1v3.5a1 1 0 0 1-1 1H5.5L3 10.5v-2H2a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M12 6.5h2a1 1 0 0 1 1 1V11a1 1 0 0 1-1 1h-1v2l-2.5-2H8a1 1 0 0 1-1-1v-.5"/></g></symbol>
  <symbol id="i-review" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 2h6l3 3v9h-9z"/><path d="M6 9.2l1.6 1.6L10.5 7.8"/></g></symbol>
  <symbol id="i-chat" viewBox="0 0 16 16"><path d="M2.5 3h11a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1H7l-3 2.5V11H2.5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></symbol>
  <symbol id="i-check" viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-x" viewBox="0 0 16 16"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="i-half" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 3a5 5 0 0 1 0 10z" fill="currentColor"/></symbol>
  <symbol id="i-ring" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5" fill="none" stroke="currentColor" stroke-width="1.5"/></symbol>
  <symbol id="i-dash" viewBox="0 0 16 16"><path d="M4.5 8h7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="i-stop" viewBox="0 0 16 16"><rect x="3.5" y="3.5" width="9" height="9" rx="1.5" fill="currentColor"/></symbol>
  <symbol id="i-list" viewBox="0 0 16 16"><path d="M3 4.5h10M3 8h10M3 11.5h6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
  <symbol id="i-theme" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 2.5a5.5 5.5 0 0 1 0 11z" fill="currentColor"/></symbol>
  <symbol id="i-gear" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="8" cy="8" r="2"/><path d="M8 1.8v1.6M8 12.6v1.6M1.8 8h1.6M12.6 8h1.6M3.6 3.6l1.1 1.1M11.3 11.3l1.1 1.1M3.6 12.4l1.1-1.1M11.3 4.7l1.1-1.1"/></g></symbol>
  <symbol id="i-help" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="8" cy="8" r="6"/><path d="M6.3 6.4a1.8 1.8 0 1 1 2.5 1.6c-.5.2-.8.6-.8 1.1v.3M8 11.4v.1"/></g></symbol>
  <symbol id="i-panel" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><rect x="2" y="2.5" width="12" height="11" rx="1.5"/><path d="M10 2.5v11"/></g></symbol>
  <symbol id="i-trash" viewBox="0 0 16 16"><path d="M2.5 4.5h11M6 4.5V3h4v1.5M4 4.5l.7 9h6.6l.7-9" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-download" viewBox="0 0 16 16"><path d="M8 2.5v8M4.5 7L8 10.5 11.5 7M3 13.5h10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-copy" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5"/><path d="M3.5 10.5H3a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1h6.5a1 1 0 0 1 1 1v.5"/></g></symbol>
  <symbol id="i-refresh" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 8a5 5 0 1 1-1.5-3.6"/><path d="M13 2.5v3h-3"/></g></symbol>
  <symbol id="i-lock" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><rect x="3" y="7" width="10" height="7" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/></g></symbol>
  <symbol id="i-alert" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="8" r="6"/><path d="M8 5v3.5M8 11v.1"/></g></symbol>
  <symbol id="i-target" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="5.5"/><circle cx="8" cy="8" r="2"/></g></symbol>
</svg>

<script src="/app.js"></script>
</body>
</html>
