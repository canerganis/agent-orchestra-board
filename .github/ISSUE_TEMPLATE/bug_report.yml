name: Bug report
description: Something does not work as documented.
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not paste API keys, session ids or full transcripts; redact anything private. Security problems go through SECURITY.md, not here.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you saw instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. node bin/agent-orchestra-board.js . --port 4317
        2. Create seats ... start a Debate with ...
        3. ...
    validations:
      required: true
  - type: dropdown
    id: workflow
    attributes:
      label: Workflow
      options: [Debate, Propose -> Review, Direct chat, Seats / settings, Usage limits, Server / security gate, UI, Other]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Agent Orchestra Board version or commit
      placeholder: 0.1.0 / 2cbf49c
    validations:
      required: true
  - type: input
    id: cli
    attributes:
      label: CLI versions
      description: Output of `claude --version` and `codex --version` (whichever seats are involved).
      placeholder: claude 2.x.y, codex-cli 0.160.0
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS and Node version (`node --version`), shell if relevant.
      placeholder: Windows 11, Node 22.x, Git Bash
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and room items
      description: Server console output, the failing room's tool-call lines and the error on the failed message, or `node bin/agent-orchestra-board.js doctor` output. Redact paths and private text.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I ran `node bin/agent-orchestra-board.js doctor` and included anything relevant.
        - label: I searched existing issues.
